# aaa.is-a.dev — static portfolio behind nginx
# HTTP only until DNS points here; then: certbot --nginx -d aaa.is-a.dev

server {
    listen 80;
    listen [::]:80;
    server_name aaa.is-a.dev;
    server_tokens off;

    root /var/www/aaa;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/aaa;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
}
