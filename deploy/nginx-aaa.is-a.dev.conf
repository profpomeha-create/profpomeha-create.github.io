# aaa.is-a.dev — High-performance static portfolio configuration for Nginx
# Optimized for lowest TTFB, Core Web Vitals, HTTP/2, and aggressive caching.

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name aaa.is-a.dev;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/aaa;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aaa.is-a.dev;
    server_tokens off;

    root /var/www/aaa;
    index index.html;

    # SSL Certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/aaa.is-a.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aaa.is-a.dev/privkey.pem;

    # SSL Performance Tuning (minimizes TLS handshake TTFB)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_buffer_size 4k;

    # System & Kernel Network Optimizations for TTFB
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # In-memory file cache: avoids repeated disk IO on static requests
    open_file_cache max=5000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Compression
    gzip on;
    gzip_static on; # Serves precompressed .gz files directly with zero CPU overhead
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/ld+json
        application/xml
        text/xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https: https://mc.yandex.ru; font-src 'self' https://fonts.gstatic.com https://yastatic.net data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://mc.yandex.ru https://yastatic.net https://*.yandex.ru; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://mc.yandex.ru https://*.mc.yandex.ru https://yastatic.net https://*.yandex.ru; connect-src 'self' https://mc.yandex.ru https://*.mc.yandex.ru https://*.yandex.ru https://*.yandex.net https://mc.webvisor.com https://mc.webvisor.org wss://*.yandex.ru wss://mc.yandex.ru; frame-src 'self' https://mc.yandex.ru https://*.yandex.ru blob:; child-src 'self' blob: https://mc.yandex.ru https://*.yandex.ru;" always;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location = /robots.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /yandex_f3d45a2d7896cfdd.html {
        default_type text/html;
        try_files $uri =404;
    }

    location = /googled4275817b7b8a702.html {
        default_type text/html;
        try_files $uri =404;
    }

    location = /integrations/social/vk {
        default_type text/html;
        alias /var/www/aaa/integrations/social/vk.html;
    }

    # Immutable cache for Vite fingerprinted assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static media files
    location ~* \.(png|jpg|jpeg|gif|svg|woff2?|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Prerendered HTML pages
    location / {
        add_header Cache-Control "public, max-age=1800, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https: https://mc.yandex.ru; font-src 'self' https://fonts.gstatic.com https://yastatic.net data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://mc.yandex.ru https://yastatic.net https://*.yandex.ru; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://mc.yandex.ru https://*.mc.yandex.ru https://yastatic.net https://*.yandex.ru; connect-src 'self' https://mc.yandex.ru https://*.mc.yandex.ru https://*.yandex.ru https://*.yandex.net https://mc.webvisor.com https://mc.webvisor.org wss://*.yandex.ru wss://mc.yandex.ru; frame-src 'self' https://mc.yandex.ru https://*.yandex.ru blob:; child-src 'self' blob: https://mc.yandex.ru https://*.yandex.ru;" always;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
